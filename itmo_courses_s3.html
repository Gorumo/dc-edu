.resource:hover{border-color:#bfd0ff;background:#f3f6ff;transform:translateY(-1px)}.resource-name{flex:1;overflow-wrap:anywhere;font-size:13px;line-height:1.35}

.openmark{font-size:13px;color:#8a99b2}[hidden]{display:none!important}.empty{color:var(--muted);padding:20px 0}

<script>
const catalog=JSON.parse(document.getElementById('catalog').textContent),root=document.getElementById('courses'),search=document.getElementById('search');
function el(t,c,text){const n=document.createElement(t);if(c)n.className=c;if(text!==undefined)n.textContent=text;return n}
function forms(n,one,few,many){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return many;if(n1>1&&n1<5)return few;if(n1===1)return one;return many}
function paint(q=''){
  root.replaceChildren();let matches=0;
  for(const [ci,c] of catalog.entries()){
    const groups=c.groups.map(g=>({...g,files:g.files.filter(f=>!q||[c.name,g.name,f.name,f.type].join(' ').toLowerCase().includes(q))})).filter(g=>g.files.length);
    if(!groups.length)continue;matches++;
    const card=el('details','course');if(q)card.open=true;
    const head=el('summary','course-head');head.append(el('div','emblem',String(ci+1).padStart(2,'0')));
    const ctxt=el('div','ctext');const total=groups.reduce((a,g)=>a+g.files.length,0);
    const unit=c.id==='AI_Instruments'?'тем':'занятий';
    ctxt.append(el('h2','',c.name),el('div','meta',`${groups.length} ${unit} · ${total} ${forms(total,'материал','материала','материалов')}`));
    head.append(ctxt,el('span','chev','⌄'));card.append(head);
    const ll=el('div','lessonlist');
    for(const g of groups){
      const d=el('details','lesson');if(q)d.open=true;const sum=el('summary');
      sum.append(el('span','',g.name));const r=el('span','lesson-right');r.append(el('span','count',String(g.files.length)),el('span','chev','⌄'));sum.append(r);d.append(sum);
      const links=el('div','links');
      for(const f of g.files){
        const a=el('a','resource');a.href=f.url;a.target='_blank';a.rel='noopener noreferrer';
        const name=el('div','resource-name');name.append(el('span','',f.name),el('span','kind',f.type));
        a.append(el('span','tag',f.ext),name,el('span','openmark','↗'));links.append(a)
      }
      d.append(links);ll.append(d)
    }
    card.append(ll);root.append(card)
  }
  if(!matches)root.append(el('div','empty','Ничего не найдено. Попробуйте другой запрос.'))
}
paint();search.addEventListener('input',()=>paint(search.value.trim().toLowerCase()));
</script></body></html>
